name: Deploy to Render

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test app imports
        run: |
          python -c "from app import app; print('✓ App imports successfully')"
          python -c "from budget_planner import BudgetPlanner; print('✓ Budget planner imports successfully')"

      - name: Check Flask app health
        run: |
          python -c "
          from app import app
          with app.test_client() as client:
              response = client.get('/health')
              assert response.status_code == 200
              print('✓ Health check passed')
          "

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✓ Deploy triggered on Render"

      - name: Wait for deployment
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Waiting 60 seconds for deployment to complete..."
          sleep 60

      - name: Check deployed app
        if: ${{ secrets.RENDER_APP_URL }}
        run: |
          echo "Checking deployed app at ${{ secrets.RENDER_APP_URL }}"
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_APP_URL }}/health")
          if [ $response -eq 200 ]; then
            echo "✓ Deployed app is healthy!"
          else
            echo "⚠ Warning: App returned status code $response"
          fi

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Personal Budget Planner has been deployed!" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.RENDER_APP_URL }}" ]; then
            echo "- 🌐 App URL: ${{ secrets.RENDER_APP_URL }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- ✅ Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- 📅 Deployed: $(date)" >> $GITHUB_STEP_SUMMARY
